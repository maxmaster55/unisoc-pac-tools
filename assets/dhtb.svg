<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
<rect width="880" height="270" rx="12" fill="#0f172a"/>
<text x="24" y="36" fill="#e2e8f0" font-size="17" font-weight="600">DHTB image</text>
<text x="24" y="58" fill="#94a3b8">The container around FDL, BOOT, KernelImg and UserImg images. Little endian; not to scale.</text>
<rect x="40" y="96" width="82" height="54" rx="0" fill="#3b2f12" stroke="#fbbf24"/>
<text x="81.0" y="119" fill="#fbbf24" font-size="13" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-weight="600">"DHTB"</text>
<text x="81.0" y="137" fill="#94a3b8" font-size="11" text-anchor="middle">magic</text>
<line x1="40" y1="92" x2="40" y2="84" stroke="#94a3b8"/>
<text x="43" y="90" fill="#94a3b8" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">0x000</text>
<rect x="122" y="96" width="70" height="54" rx="0" fill="#3b2f12" stroke="#fbbf24"/>
<text x="157.0" y="119" fill="#fbbf24" font-size="13" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-weight="600">1</text>
<text x="157.0" y="137" fill="#94a3b8" font-size="11" text-anchor="middle">version</text>
<line x1="122" y1="92" x2="122" y2="84" stroke="#94a3b8"/>
<text x="125" y="90" fill="#94a3b8" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">0x004</text>
<rect x="192" y="96" width="92" height="54" rx="0" fill="#1e293b" stroke="#94a3b8"/>
<text x="238.0" y="119" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-weight="600">0</text>
<text x="238.0" y="137" fill="#94a3b8" font-size="11" text-anchor="middle">0x08..0x2F</text>
<line x1="192" y1="92" x2="192" y2="84" stroke="#94a3b8"/>
<text x="195" y="90" fill="#94a3b8" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">0x008</text>
<rect x="284" y="96" width="104" height="54" rx="0" fill="#123524" stroke="#4ade80"/>
<text x="336.0" y="119" fill="#4ade80" font-size="13" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-weight="600">payload_len</text>
<text x="336.0" y="137" fill="#94a3b8" font-size="11" text-anchor="middle">u32</text>
<line x1="284" y1="92" x2="284" y2="84" stroke="#94a3b8"/>
<text x="287" y="90" fill="#94a3b8" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">0x030</text>
<rect x="388" y="96" width="112" height="54" rx="0" fill="#1e293b" stroke="#94a3b8"/>
<text x="444.0" y="119" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-weight="600">0</text>
<text x="444.0" y="137" fill="#94a3b8" font-size="11" text-anchor="middle">0x34..0x1FF</text>
<line x1="388" y1="92" x2="388" y2="84" stroke="#94a3b8"/>
<text x="391" y="90" fill="#94a3b8" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">0x034</text>
<rect x="500" y="96" width="336" height="54" rx="0" fill="#2a1f45" stroke="#c084fc"/>
<text x="668.0" y="119" fill="#c084fc" font-size="13" text-anchor="middle" font-weight="600">payload</text>
<text x="668.0" y="137" fill="#94a3b8" font-size="11" text-anchor="middle">payload_len bytes</text>
<line x1="500" y1="92" x2="500" y2="84" stroke="#94a3b8"/>
<text x="503" y="90" fill="#94a3b8" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">0x200</text>
<text x="833" y="90" fill="#94a3b8" font-size="11" text-anchor="end">file end</text>
<path d="M41 158 v8 H499 v-8" fill="none" stroke="#fbbf24" stroke-width="1.6"/>
<text x="270.0" y="184" fill="#fbbf24" font-size="12.5" text-anchor="middle">0x200-byte header</text>
<path d="M501 158 v8 H835 v-8" fill="none" stroke="#c084fc" stroke-width="1.6"/>
<text x="668.0" y="184" fill="#c084fc" font-size="12.5" text-anchor="middle">payload_len == file_size - 0x200</text>
<text x="24" y="226" fill="#94a3b8" font-size="12">Every header byte except magic, version and payload_len was zero in the images checked (no digest or signature).</text>
<text x="24" y="248" fill="#e2e8f0" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">upt dhtb-strip image -o payload.bin</text>
<text x="330" y="248" fill="#e2e8f0" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace">upt dhtb-pack payload.bin -o image [--pad-to N]</text>
</svg>
