<text x="24" y="548" fill="#94a3b8" font-size="12">Both CRCs are CRC-16/ARC (reflected, poly 0xA001, init 0).</text>
<text x="24" y="565" fill="#94a3b8" font-size="12">upt check verifies them; upt repack recomputes them.</text>
